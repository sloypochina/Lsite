<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANSANE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

        body { 
            background: #000; 
            color: white; 
            overflow: hidden; 
            font-family: 'Space Grotesk', sans-serif; 
            margin: 0; 
            height: 100vh;
        }

        /* Видео-фон */
        .video-bg {
            position: fixed; inset: 0; z-index: -3;
            width: 100vw; height: 100vh;
            object-fit: cover;
            filter: blur(5px) brightness(0.4); 
        }

        /* Стилизованная виньетка */
        body::after {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(15, 30, 80, 0.4) 80%, rgba(0,0,0,0.9) 100%);
            box-shadow: inset 0 0 100px rgba(59, 130, 246, 0.2);
            pointer-events: none; 
            z-index: -1;
        }

        /* Эффект сканирующих линий */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* ========================================= */
        /* === ФОН ЗАГОЛОВКА (ЦИФРОВАЯ КРАСКА) ===== */
        /* ========================================= */
        
        .artist-header-wrapper {
            position: relative;
            display: inline-block;
            z-index: 10;
        }

        .artist-header-wrapper::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 110%; height: 160%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, rgba(59, 130, 246, 0.5), rgba(168, 85, 247, 0.4), rgba(244, 114, 182, 0.4));
            filter: blur(30px);
            z-index: -1; pointer-events: none;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: paint-morph 8s ease-in-out infinite alternate;
        }

        @keyframes paint-morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(-50%, -50%) scale(0.95) rotate(0deg); }
            100% { border-radius: 60% 40% 30% 70% / 60% 40% 50% 60%; transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
        }

        /* ========================================= */
        /* === ЭФФЕКТ ЖИДКОГО СТЕКЛА ДЛЯ КНОПОК ==== */
        /* ========================================= */
        
        .glass-btn {
            position: relative; display: flex; justify-content: center; align-items: center;
            font-weight: bold; text-decoration: none; cursor: pointer; overflow: hidden;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: transparent;
            padding: 12px 24px; box-shadow: 0 6px 6px rgba(0, 0, 0, 0.2), 0 0 20px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 2.2); outline: none;
        }

        .glass-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* Универсальные классы жидкого стекла (теперь и для окна) */
        .liquidGlass-effect {
            position: absolute; z-index: 0; inset: 0; backdrop-filter: blur(3px);
            filter: url(#glass-distortion); overflow: hidden; isolation: isolate; border-radius: inherit;
        }

        .liquidGlass-tint {
            position: absolute; inset: 0; z-index: 1; background: rgba(255, 255, 255, 0.05);
            border-radius: inherit; transition: background 0.3s ease;
        }

        .glass-btn:hover .liquidGlass-tint { background: rgba(255, 255, 255, 0.15); }

        .liquidGlass-shine {
            position: absolute; inset: 0; z-index: 2; overflow: hidden;
            box-shadow: inset 2px 2px 1px 0 rgba(255, 255, 255, 0.3), inset -1px -1px 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: inherit; pointer-events: none;
        }

        .liquidGlass-text {
            position: relative; z-index: 3; letter-spacing: 2px; text-transform: uppercase; color: white; white-space: nowrap;
        }

        /* ========================================= */
        /* === КНОПКА PRICE (ПУЛЬСИРУЮЩИЙ СВЕТ) ==== */
        /* ========================================= */
        
        .btn-price-main {
            width: 100%; max-width: 225px; margin-bottom: 15px;
            animation: price-pulse-glow 3s infinite alternate;
        }
        
        .btn-price-main .liquidGlass-text { font-size: 1.1rem; }

        @keyframes price-pulse-glow {
            0% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 0 5px rgba(59, 130, 246, 0.1); }
            100% { box-shadow: 0 0 35px rgba(59, 130, 246, 0.6), inset 0 0 15px rgba(59, 130, 246, 0.3); }
        }

        .btn-price-main:hover {
            animation: none; box-shadow: 0 0 40px rgba(59, 130, 246, 0.8), inset 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* ========================================= */
        /* === ОКНО ПРАЙСА (Liquid Glass Edition) == */
        /* ========================================= */
        
        .price-win {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; width: 95%; max-width: 800px; /* Сделал шире для твоей картинки */
            display: none; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(59, 130, 246, 0.2);
        }

        /* Затемняем фон стекла специально для окна, чтобы текст и картинка читались лучше */
        .price-win .liquidGlass-tint {
            background: rgba(10, 10, 15, 0.5); 
        }

        /* Контент поверх стекла */
        .price-win-content {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
        }

        .win-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px; cursor: move; display: flex; justify-content: space-between;
            font-size: 13px; font-weight: bold; font-family: monospace; letter-spacing: 1px;
        }

        .win-close-btn {
            color: #f87171; cursor: pointer; transition: all 0.3s ease; background: none; border: none; font-family: inherit;
        }
        
        .win-close-btn:hover {
            color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); transform: scale(1.1);
        }

        .price-img-container { 
            width: 100%; max-height: 75vh; overflow-y: auto; padding: 20px;
        }

        /* Кастомный стеклянный скроллбар для окна с картинкой */
        .price-img-container::-webkit-scrollbar { width: 8px; }
        .price-img-container::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; margin: 10px; }
        .price-img-container::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .price-img-container::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.8); }

        /* Заголовок с анимацией */
        .killer-header span {
            display: inline-block; animation: snake-jump 4s infinite; transition: 0.3s ease-out;
        }
        .killer-header span:hover {
            animation: none !important; transform: scale(1.6) translateY(-10px);
            text-shadow: 0 0 20px currentColor;
        }
        
        .hover-color-1 { color: #3b82f6 !important; }
        .hover-color-2 { color: #f472b6 !important; }
        .hover-color-3 { color: #a855f7 !important; }
        .hover-color-4 { color: #ffffff !important; }
        .hover-color-5 { color: #fbbf24 !important; }

        @keyframes snake-jump {
            0%, 100% { transform: translateY(0); }
            5% { transform: translateY(-20px); }
            10% { transform: translateY(0); }
        }

        .trail-star { position: absolute; pointer-events: none; z-index: 9999; color: #ffffff; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <!-- SVG Фильтр для эффекта жидкого стекла -->
    <svg style="display: none">
        <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="150" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- Твой видео-фон -->
    <video autoplay muted loop playsinline class="video-bg" id="bg-video">
        <source src="img/bg.mp4" type="video/mp4">
    </video>
    
    <header class="absolute top-10 left-10 md:left-20 z-10">
        <!-- Обертка для фона цифровой краски -->
        <div class="artist-header-wrapper">
            <h1 class="killer-header text-5xl md:text-6xl uppercase tracking-tighter font-black whitespace-nowrap text-white">
                <span style="animation-delay: 0.1s;">&lt;</span><span style="animation-delay: 0.2s;">D</span><span style="animation-delay: 0.3s;">A</span><span style="animation-delay: 0.4s;">N</span><span style="animation-delay: 0.5s;">S</span><span style="animation-delay: 0.6s;">A</span><span style="animation-delay: 0.7s;">N</span><span style="animation-delay: 0.8s;">E</span><span style="animation-delay: 0.9s;">&gt;</span>
            </h1>
        </div>
    </header>

    <div class="absolute top-1/2 left-0 w-full transform -translate-y-1/2 flex flex-col items-center gap-4 px-4 z-10">
        
        <!-- Кнопка PRICE (С пульсирующим свечением) -->
        <button onclick="openPrice(); createTrail(event)" class="glass-btn btn-price-main">
            <div class="liquidGlass-effect"></div>
            <div class="liquidGlass-tint"></div>
            <div class="liquidGlass-shine"></div>
            <div class="liquidGlass-text">PRICE_LIST.PNG</div>
        </button>

        <!-- Остальные ссылки -->
        <div class="flex flex-wrap justify-center gap-4">
            <a href="https://tiktok.com/" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">TIKTOK</div>
            </a>
            
            <a href="https://instagram.com/" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">INSTAGRAM</div>
            </a>
            
            <a href="https://boosty.to/" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">BOOSTY</div>
            </a>
            
            <a href="https://t.me/ТВОЙ_ТГ" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div>
                <div class="liquidGlass-tint"></div>
                <div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">TG_ACC.EXE</div>
            </a>
        </div>

    </div>

    <!-- Окно прайса (обновлено до Liquid Glass) -->
    <div id="price-window" class="price-win">
        
        <!-- Слои жидкого стекла для фона окна -->
        <div class="liquidGlass-effect"></div>
        <div class="liquidGlass-tint"></div>
        <div class="liquidGlass-shine"></div>

        <!-- Контент -->
        <div class="price-win-content">
            <div class="win-header">
                <span>IMAGE_VIEWER.EXE - price_list.png</span>
                <button onclick="closePrice()" class="win-close-btn">[ CLOSE X ]</button>
            </div>
            
            <div class="price-img-container">
                <!-- Я подставил имя картинки, которую ты скинул в чат (input_file_0.png) -->
                <!-- Так что, если она лежит в одной папке с index.html, она сразу загрузится -->
                <img src="input_file_0.png" alt="Price List" class="w-full h-auto block rounded-lg shadow-2xl">
            </div>
        </div>
    </div>

    <script>
        window.onload = () => { document.getElementById('bg-video').play(); };

        $( function() {
            // Перемещение работает только за область header
            $( "#price-window" ).draggable({ handle: ".win-header" });
        });

        function openPrice() { $('#price-window').fadeIn(200); }
        function closePrice() { $('#price-window').fadeOut(200); }
        
        $('.killer-header span').on('mouseenter', function() {
            const randomColorNum = Math.floor(Math.random() * 5) + 1;
            $(this).addClass('hover-color-' + randomColorNum);
        }).on('mouseleave', function() {
            $(this).removeClass('hover-color-1 hover-color-2 hover-color-3 hover-color-4 hover-color-5');
        });

        function createTrail(e) {
            const el = document.createElement('div');
            el.className = 'trail-star';
            el.innerHTML = '✦';
            el.style.left = e.pageX + 'px'; el.style.top = e.pageY + 'px';
            document.body.appendChild(el);
            $(el).animate({ opacity: 0, top: '-=50px', fontSize: '30px' }, 800, () => el.remove());
        }
    </script>
</body>
</html>
