<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANSANE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        /* Шрифты */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Playfair+Display:ital,wght@1,900&display=swap');

        body { 
            background: #050505; 
            color: white; 
            overflow: hidden; 
            font-family: 'Space Grotesk', monospace; 
            margin: 0; 
            height: 100vh;
        }

        /* Видео-фон с легким блюром */
        .video-bg {
            position: fixed; inset: 0; z-index: -3;
            width: 100vw; height: 100vh;
            object-fit: cover;
            filter: blur(5px) brightness(0.5); 
        }

        /* Виньетка */
        body::after {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(
                135deg, 
                rgba(0, 0, 0, 0.8) 0%, 
                rgba(15, 30, 80, 0.5) 50%, 
                rgba(255, 255, 255, 0.1) 100%
            );
            box-shadow: inset 0 0 150px 50px rgba(0, 0, 0, 0.5);
            pointer-events: none; 
            z-index: -1;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: white;
            display: inline-block;
        }
        
        .smooth-hover-btn {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .smooth-hover-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.8);
        }

        /* Змейка для заголовка */
        .killer-header span {
            display: inline-block;
            animation: snake-jump 4s infinite;
            transition: 0.3s ease-out;
            cursor: default;
        }

        /* Анимация и Цвет букв при наведении */
        .killer-header span:hover {
            animation: none !important;
            transform: scale(1.6) translateY(-10px);
            text-shadow: 0 0 20px currentColor; /* Свечение в цвет буквы */
        }
        
        /* Цвета для букв (будут применяться через JS) */
        .hover-color-1 { color: #3b82f6 !important; } /* Синий */
        .hover-color-2 { color: #f472b6 !important; } /* Розовый */
        .hover-color-3 { color: #a855f7 !important; } /* Фиолетовый */
        .hover-color-4 { color: #ffffff !important; } /* Белый */
        .hover-color-5 { color: #fbbf24 !important; } /* Желтый */

        @keyframes snake-jump {
            0%, 100% { transform: translateY(0); }
            5% { transform: translateY(-20px); }
            10% { transform: translateY(0); }
        }

        .trail-star { position: absolute; pointer-events: none; z-index: 9999; color: #ffffff; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg" id="bg-video">
        <source src="img/bg.mp4" type="video/mp4">
    </video>
    
    <header class="absolute top-10 left-10 md:left-20">
        <h1 class="killer-header text-5xl md:text-6xl uppercase tracking-tighter font-black whitespace-nowrap text-white">
            <span style="animation-delay: 0.1s;">&lt;</span><span style="animation-delay: 0.2s;">D</span><span style="animation-delay: 0.3s;">A</span><span style="animation-delay: 0.4s;">N</span><span style="animation-delay: 0.5s;">S</span><span style="animation-delay: 0.6s;">A</span><span style="animation-delay: 0.7s;">N</span><span style="animation-delay: 0.8s;">E</span><span style="animation-delay: 0.9s;">&gt;</span>
        </h1>
        <p class="text-white/40 text-sm mt-2 tracking-widest font-mono">P.S. I'm from Russia .. 67</p>
    </header>

    <div class="absolute top-1/2 left-0 w-full transform -translate-y-1/2 flex flex-wrap justify-center items-center gap-6 px-4 z-10">
        <a href="https://tiktok.com/" target="_blank" onclick="createTrail(event)" class="glass-btn smooth-hover-btn hover:bg-black/80">TIKTOK</a>
        <a href="https://instagram.com/" target="_blank" onclick="createTrail(event)" class="glass-btn smooth-hover-btn hover:bg-pink-600/50">INSTAGRAM</a>
        <a href="https://boosty.to/" target="_blank" onclick="createTrail(event)" class="glass-btn smooth-hover-btn hover:bg-orange-500/50">BOOSTY</a>
        <a href="https://t.me/" target="_blank" onclick="createTrail(event)" class="glass-btn smooth-hover-btn hover:bg-blue-500/50">TELEGRAM</a>
    </div>

    <script>
        window.onload = () => { document.getElementById('bg-video').play(); };
        
        // Скрипт для рандомных цветов букв при наведении
        $('.killer-header span').on('mouseenter', function() {
            const randomColorNum = Math.floor(Math.random() * 5) + 1;
            $(this).addClass('hover-color-' + randomColorNum);
        }).on('mouseleave', function() {
            // Удаляем все цветовые классы, когда уводим мышку
            $(this).removeClass('hover-color-1 hover-color-2 hover-color-3 hover-color-4 hover-color-5');
        });

        function createTrail(e) {
            const el = document.createElement('div');
            el.className = 'trail-star';
            el.innerHTML = '✦';
            el.style.left = e.pageX + 'px'; el.style.top = e.pageY + 'px';
            document.body.appendChild(el);
            $(el).animate({ opacity: 0, top: '-=50px', fontSize: '30px' }, 800, () => el.remove());
        }
    </script>
</body>
</html>
