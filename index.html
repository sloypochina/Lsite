<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANSANE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <!-- Подключаем легкую библиотеку для плавного зума и тач-жестов -->
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.0/dist/panzoom.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

        body { 
            background: #000; 
            color: white; 
            overflow: hidden; 
            font-family: 'Space Grotesk', sans-serif; 
            margin: 0; 
            height: 100vh;
        }

        /* Видео-фон */
        .video-bg {
            position: fixed; inset: 0; z-index: -3;
            width: 100vw; height: 100vh;
            object-fit: cover;
            filter: blur(5px) brightness(0.4); 
            /* Для плавности на мобильных устройствах */
            transform: translateZ(0);
        }

        /* Стилизованная виньетка */
        body::after {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(15, 30, 80, 0.4) 80%, rgba(0,0,0,0.9) 100%);
            box-shadow: inset 0 0 100px rgba(59, 130, 246, 0.2);
            pointer-events: none; 
            z-index: -1;
        }

        /* Эффект сканирующих линий */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* ========================================= */
        /* === ФОН ЗАГОЛОВКА (ЦИФРОВАЯ КРАСКА) ===== */
        /* ========================================= */
        
        .artist-header-wrapper {
            position: relative; display: inline-block; z-index: 10;
        }

        .artist-header-wrapper::before {
            content: ""; position: absolute; top: 50%; left: 50%;
            width: 110%; height: 160%; transform: translate(-50%, -50%);
            background: linear-gradient(45deg, rgba(59, 130, 246, 0.5), rgba(168, 85, 247, 0.4), rgba(244, 114, 182, 0.4));
            filter: blur(30px); z-index: -1; pointer-events: none;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: paint-morph 8s ease-in-out infinite alternate;
        }

        @keyframes paint-morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(-50%, -50%) scale(0.95) rotate(0deg); }
            100% { border-radius: 60% 40% 30% 70% / 60% 40% 50% 60%; transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
        }

        /* ========================================= */
        /* === ЭФФЕКТ ЖИДКОГО СТЕКЛА ДЛЯ КНОПОК ==== */
        /* ========================================= */
        
        .glass-btn {
            position: relative; display: flex; justify-content: center; align-items: center;
            font-weight: bold; text-decoration: none; cursor: pointer; overflow: hidden;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: transparent;
            padding: 12px 24px; box-shadow: 0 6px 6px rgba(0, 0, 0, 0.2), 0 0 20px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 2.2); outline: none;
        }

        .glass-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .liquidGlass-effect {
            position: absolute; z-index: 0; inset: 0; backdrop-filter: blur(3px);
            filter: url(#glass-distortion); overflow: hidden; isolation: isolate; border-radius: inherit;
        }

        .liquidGlass-tint {
            position: absolute; inset: 0; z-index: 1; background: rgba(255, 255, 255, 0.05);
            border-radius: inherit; transition: background 0.3s ease;
        }

        .glass-btn:hover .liquidGlass-tint { background: rgba(255, 255, 255, 0.15); }

        .liquidGlass-shine {
            position: absolute; inset: 0; z-index: 2; overflow: hidden;
            box-shadow: inset 2px 2px 1px 0 rgba(255, 255, 255, 0.3), inset -1px -1px 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: inherit; pointer-events: none;
        }

        .liquidGlass-text {
            position: relative; z-index: 3; letter-spacing: 2px; text-transform: uppercase; color: white; white-space: nowrap;
        }

        .btn-price-main {
            width: 100%; max-width: 225px; margin-bottom: 15px;
            animation: price-pulse-glow 3s infinite alternate;
        }
        
        .btn-price-main .liquidGlass-text { font-size: 1.1rem; }

        @keyframes price-pulse-glow {
            0% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 0 5px rgba(59, 130, 246, 0.1); }
            100% { box-shadow: 0 0 35px rgba(59, 130, 246, 0.6), inset 0 0 15px rgba(59, 130, 246, 0.3); }
        }

        .btn-price-main:hover {
            animation: none; box-shadow: 0 0 40px rgba(59, 130, 246, 0.8), inset 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* Заголовок с анимацией */
        .killer-header span {
            display: inline-block; animation: snake-jump 4s infinite; transition: 0.3s ease-out;
        }
        .killer-header span:hover {
            animation: none !important; transform: scale(1.6) translateY(-10px);
            text-shadow: 0 0 20px currentColor;
        }
        
        .hover-color-1 { color: #3b82f6 !important; }
        .hover-color-2 { color: #f472b6 !important; }
        .hover-color-3 { color: #a855f7 !important; }
        .hover-color-4 { color: #ffffff !important; }
        .hover-color-5 { color: #fbbf24 !important; }

        @keyframes snake-jump {
            0%, 100% { transform: translateY(0); }
            5% { transform: translateY(-20px); }
            10% { transform: translateY(0); }
        }

        .trail-star { position: absolute; pointer-events: none; z-index: 9999; color: #ffffff; font-weight: bold; font-size: 20px; }


        /* ========================================= */
        /* TRANSPARENT GLOWING EDGES CARD (PRICE)    */
        /* ========================================= */

        .price-win-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 100; display: none; 
        }

        .glowing-card {
            --glow-sens: 30;
            --blend: screen;
            --glow-blend: plus-lighter;
            --glow-color: 40deg 80% 80%;
            --glow-boost: 0%;
            
            --pads: 20px;
            --color-sens: calc(var(--glow-sens) + 20);
            --pointer-°: 45deg;
            
            position: relative;
            width: 95vw; 
            max-width: 850px;
            border-radius: 1.768em;
            isolation: isolate;
            
            background: rgba(15, 15, 25, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
        }
        
        .glowing-card:not(:hover):not(.animating) .card-glow,
        .glowing-card:not(:hover):not(.animating) .card-border-wrapper,
        .glowing-card:not(:hover):not(.animating) .card-inner-mesh {
            opacity: 0 !important;
            transition: opacity 0.75s ease-in-out;
        }

        .card-glow {
            --outset: var(--pads);
            position: absolute; inset: calc(var(--outset) * -1); border-radius: inherit; z-index: -1;
            pointer-events: none; transition: opacity 0.25s ease-out;
            mask-image: conic-gradient(from var(--pointer-°) at center, black 2.5%, transparent 10%, transparent 90%, black 97.5%);
            opacity: calc((var(--pointer-d) - var(--glow-sens)) / (100 - var(--glow-sens)));
            mix-blend-mode: var(--glow-blend);
        }
        
        .card-glow::before {
            content: ""; position: absolute; inset: var(--outset); border-radius: inherit;
            box-shadow: 
                inset 0 0 0 1px hsl( var(--glow-color) / 100%), 
                inset 0 0 1px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 60%)), 
                inset 0 0 3px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 50%)), 
                inset 0 0 6px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 40%)), 
                inset 0 0 15px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 30%)), 
                inset 0 0 25px 2px hsl( var(--glow-color) / calc(var(--glow-boost) + 20%)), 
                inset 0 0 50px 2px hsl( var(--glow-color) / calc(var(--glow-boost) + 10%)), 
                0 0 1px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 60%)), 
                0 0 3px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 50%)), 
                0 0 6px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 40%)), 
                0 0 15px 0 hsl( var(--glow-color) / calc(var(--glow-boost) + 30%)), 
                0 0 25px 2px hsl( var(--glow-color) / calc(var(--glow-boost) + 20%)), 
                0 0 50px 2px hsl( var(--glow-color) / calc(var(--glow-boost) + 10%));
        }

        .card-border-wrapper {
            position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
            mask-image: conic-gradient(from var(--pointer-°) at center, black 25%, transparent 40%, transparent 60%, black 75%);
            opacity: calc((var(--pointer-d) - var(--color-sens)) / (100 - var(--color-sens)));
            transition: opacity 0.25s ease-out;
        }

        .card-border-glow {
            position: absolute; inset: 0; border-radius: inherit;
            padding: 2px;
            background:
                radial-gradient(at 80% 55%, hsla(268,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 69% 34%, hsla(349,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 8% 6%, hsla(136,100%,78%,1) 0px, transparent 50%),
                radial-gradient(at 41% 38%, hsla(192,100%,64%,1) 0px, transparent 50%),
                radial-gradient(at 86% 85%, hsla(186,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 82% 18%, hsla(52,100%,65%,1) 0px, transparent 50%),
                radial-gradient(at 51% 4%, hsla(12,100%,72%,1) 0px, transparent 50%),
                linear-gradient(#c299ff 0 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .card-inner-mesh {
            position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
            background:
                radial-gradient(at 80% 55%, hsla(268,100%,76%,1) 0px, transparent 50%),
                radial-gradient(at 69% 34%, hsla(349,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 8% 6%, hsla(136,100%,78%,1) 0px, transparent 50%),
                radial-gradient(at 41% 38%, hsla(192,100%,64%,1) 0px, transparent 50%),
                radial-gradient(at 86% 85%, hsla(186,100%,74%,1) 0px, transparent 50%),
                radial-gradient(at 82% 18%, hsla(52,100%,65%,1) 0px, transparent 50%),
                radial-gradient(at 51% 4%, hsla(12,100%,72%,1) 0px, transparent 50%),
                linear-gradient(#c299ff 0 100%);
            mask-image:
                linear-gradient( to bottom, black, black ),
                radial-gradient( ellipse at 50% 50%, black 40%, transparent 65% ),
                radial-gradient( ellipse at 66% 66%, black 5%, transparent 40% ),
                radial-gradient( ellipse at 33% 33%, black 5%, transparent 40% ),
                radial-gradient( ellipse at 66% 33%, black 5%, transparent 40% ),
                radial-gradient( ellipse at 33% 66%, black 5%, transparent 40% ),
                conic-gradient( from var(--pointer-°) at center, transparent 5%, black 15%, black 85%, transparent 95% );
            mask-composite: subtract,add,add,add,add,add;
            opacity: calc((var(--pointer-d) - var(--color-sens)) / (100 - var(--color-sens)));
            mix-blend-mode: var(--blend);
            transition: opacity 0.25s ease-out;
        }

        .glowing-card-inner { display: flex; flex-direction: column; z-index: 2; position: relative; }

        .glowing-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace; font-weight: bold; font-size: 14px;
            color: rgba(255, 255, 255, 0.9); cursor: move; 
        }
        
        .glowing-header button {
            background: none; border: none; color: #f87171; cursor: pointer; 
            font-family: inherit; font-size: inherit; transition: all 0.2s;
        }
        
        .glowing-header button:hover {
            color: #ef4444; text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        }

        .glowing-content { padding: 15px; position: relative; }

        .price-img-container { 
            width: 100%; height: 70vh; overflow: hidden; 
            border-radius: 12px; background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); 
            display: flex; justify-content: center; align-items: center;
        }

        #price-img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            cursor: grab; 
            transition: transform 0.1s; 
        }
        
        #price-img:active {
            cursor: grabbing; 
        }

    </style>
</head>
<body>

    <!-- SVG Фильтр для кнопок -->
    <svg style="display: none">
        <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
            <feComponentTransfer in="turbulence" result="mapped">
                <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
            </feComponentTransfer>
            <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
            <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
                <fePointLight x="-200" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
            <feDisplacementMap in="SourceGraphic" in2="softMap" scale="150" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- Твой видео-фон (Исправлено для iPhone/iOS) -->
    <!-- Добавлены playsinline и muted (обязательно для autoplay на iOS) -->
    <video autoplay loop muted playsinline webkit-playsinline class="video-bg" id="bg-video">
        <source src="img/bg.mp4" type="video/mp4">
    </video>
    
    <header class="absolute top-10 left-10 md:left-20 z-10">
        <div class="artist-header-wrapper">
            <h1 class="killer-header text-5xl md:text-6xl uppercase tracking-tighter font-black whitespace-nowrap text-white">
                <span style="animation-delay: 0.1s;">&lt;</span><span style="animation-delay: 0.2s;">D</span><span style="animation-delay: 0.3s;">A</span><span style="animation-delay: 0.4s;">N</span><span style="animation-delay: 0.5s;">S</span><span style="animation-delay: 0.6s;">A</span><span style="animation-delay: 0.7s;">N</span><span style="animation-delay: 0.8s;">E</span><span style="animation-delay: 0.9s;">&gt;</span>
            </h1>
        </div>
    </header>

    <div class="absolute top-1/2 left-0 w-full transform -translate-y-1/2 flex flex-col items-center gap-4 px-4 z-10">
        <!-- Кнопка PRICE -->
        <button onclick="openPrice(); createTrail(event)" class="glass-btn btn-price-main">
            <div class="liquidGlass-effect"></div>
            <div class="liquidGlass-tint"></div>
            <div class="liquidGlass-shine"></div>
            <div class="liquidGlass-text">Price List</div>
        </button>

        <div class="flex flex-wrap justify-center gap-4">
            <a href="https://www.tiktok.com/@dansaneadorer?_r=1&_t=ZT-94iYEDE2BTh" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div><div class="liquidGlass-tint"></div><div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">TIKTOK</div>
            </a>
            <a href="https://www.instagram.com/dansaneadorer?igsh=cGF6MnpiYzBuZDU=" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div><div class="liquidGlass-tint"></div><div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">INSTAGRAM</div>
            </a>
            <a href="https://boosty.to/dansaneadorer" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div><div class="liquidGlass-tint"></div><div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">BOOSTY</div>
            </a>
            <a href="https://t.me/ТВОЙ_ТГ" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">
                <div class="liquidGlass-effect"></div><div class="liquidGlass-tint"></div><div class="liquidGlass-shine"></div>
                <div class="liquidGlass-text">TG ACC</div>
            </a>
        </div>
    </div>

    <!-- Окно прайса -->
    <div id="price-window-wrapper" class="price-win-wrapper">
        <div class="glowing-card" id="glowing-card">
            
            <span class="card-glow"></span>
            <div class="card-border-wrapper"><div class="card-border-glow"></div></div>
            <div class="card-inner-mesh"></div>
            
            <div class="glowing-card-inner">
                <header class="glowing-header">
                    <span>Price List</span>
                    <button onclick="closePrice()">[ CLOSE X ]</button>
                </header>
                
                <div class="glowing-content">

                    <!-- Плашка подсказки для зума -->
                    <div id="zoom-hint" class="absolute top-6 left-1/2 transform -translate-x-1/2 z-20 flex items-center gap-2 px-4 py-2 bg-black/60 border border-white/10 rounded-full text-white/90 text-xs font-mono backdrop-blur-md pointer-events-none transition-opacity duration-300">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                        </svg>
                        <span>SCROLL TO ZOOM</span>
                    </div>

                    <!-- Кнопка сброса зума (появляется только при отдалении) -->
                    <button id="reset-zoom" onclick="resetImgZoom()" class="absolute bottom-6 right-6 z-20 px-3 py-1.5 bg-red-500/80 hover:bg-red-500 text-white text-xs font-bold font-mono rounded shadow-[0_0_15px_rgba(239,68,68,0.5)] backdrop-blur transition-all" style="display: none;">[ RESET ZOOM ]
                    </button>

                    <!-- Контейнер с картинкой -->
                    <div class="price-img-container" id="img-container">
                        <img src="img/input_file_0.png" alt="Price List" id="price-img" draggable="false">
                    </div>

                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Инициализация видео
        window.onload = () => { 
            const bgVideo = document.getElementById('bg-video');
            bgVideo.play().catch(function(error) {
                console.log("Autoplay was prevented by browser.");
                // iOS может заблокировать даже с атрибутами, 
                // если телефон в режиме жесткой экономии энергии.
            });
        };

        // Делаем окно перетаскиваемым за шапку
        $( function() {
            $( "#price-window-wrapper" ).draggable({ handle: ".glowing-header" });
        });

        function openPrice() { 
            $('#price-window-wrapper').fadeIn(300, () => { playCardAnimation(); }); 
        }
        
        function closePrice() { 
            $('#price-window-wrapper').fadeOut(200); 
            setTimeout(resetImgZoom, 300); // Сброс зума при закрытии
        }
        
        $('.killer-header span').on('mouseenter', function() {
            const randomColorNum = Math.floor(Math.random() * 5) + 1;
            $(this).addClass('hover-color-' + randomColorNum);
        }).on('mouseleave', function() {
            $(this).removeClass('hover-color-1 hover-color-2 hover-color-3 hover-color-4 hover-color-5');
        });

        function createTrail(e) {
            const el = document.createElement('div');
            el.className = 'trail-star';
            el.innerHTML = '✦';
            el.style.left = e.pageX + 'px'; 
            el.style.top = e.pageY + 'px';
            document.body.appendChild(el);
            $(el).animate({ opacity: 0, top: '-=50px', fontSize: '30px' }, 800, () => el.remove());
        }

        // ==========================================
        // JS ДЛЯ GLOWING EDGES CARD (Из CodePen)
        // ==========================================
        const $card = document.getElementById("glowing-card");

        const cardUpdate = (e) => {
            const position = pointerPositionRelativeToElement($card, e);
            const [px, py] = position.pixels;
            const [perx, pery] = position.percent;
            const [dx, dy] = distanceFromCenter($card, px, py);
            const edge = closenessToEdge($card, px, py);
            const angle = angleFromPointerEvent($card, dx, dy);

            $card.style.setProperty('--pointer-x', `${round(perx)}%`);
            $card.style.setProperty('--pointer-y', `${round(pery)}%`);
            $card.style.setProperty('--pointer-°', `${round(angle)}deg`);
            $card.style.setProperty('--pointer-d', `${round(edge * 100)}`);
            $card.classList.remove('animating');
        };

        $card.addEventListener("pointermove", cardUpdate);

        const centerOfElement = ($el) => {
            const { width, height } = $el.getBoundingClientRect();
            return [width / 2, height / 2];
        }

        const pointerPositionRelativeToElement = ($el, e) => {
            const pos = [e.clientX, e.clientY];
            const { left, top, width, height } = $el.getBoundingClientRect();
            const x = pos[0] - left;
            const y = pos[1] - top;
            const px = clamp((100 / width) * x);
            const py = clamp((100 / height) * y);
            return { pixels: [x, y], percent:[px, py] }
        }

        const angleFromPointerEvent = ($el, dx, dy) => {
            let angleRadians = 0; 
            let angleDegrees = 0;
            if (dx !== 0 || dy !== 0) {
                angleRadians = Math.atan2(dy, dx);
                angleDegrees = angleRadians * (180 / Math.PI) + 90;
                if (angleDegrees < 0) {
                    angleDegrees += 360;
                }
            }
            return angleDegrees;
        }

        const distanceFromCenter = ($card, x, y) => {
            const [cx, cy] = centerOfElement($card); 
            return [x - cx, y - cy];
        }

        const closenessToEdge = ($card, x, y) => {
            const [cx, cy] = centerOfElement($card);
            const [dx, dy] = distanceFromCenter($card, x, y);
            let k_x = Infinity; 
            let k_y = Infinity;
            if (dx !== 0) k_x = cx / Math.abs(dx);
            if (dy !== 0) k_y = cy / Math.abs(dy);
            return clamp((1 / Math.min(k_x, k_y)), 0, 1);
        }

        const round = (value, precision = 3) => parseFloat(value.toFixed(precision));
        const clamp = (value, min = 0, max = 100) => Math.min(Math.max(value, min), max);

        const playCardAnimation = () => {
            const angleStart = 110; 
            const angleEnd = 465;
            
            $card.style.setProperty('--pointer-°', `${angleStart}deg`);
            $card.classList.add('animating');

            animateNumber({ 
                ease: easeOutCubic, 
                duration: 500, 
                onUpdate: (v) => $card.style.setProperty('--pointer-d', v) 
            });

            animateNumber({
                ease: easeInCubic, 
                delay: 0, 
                duration: 1500, 
                endValue: 50,
                onUpdate: (v) => { 
                    $card.style.setProperty('--pointer-°', `${(angleEnd - angleStart) * (v / 100) + angleStart}deg`); 
                }
            }); 

            animateNumber({
                ease: easeOutCubic, 
                delay: 1500, 
                duration: 2250, 
                startValue: 50, 
                endValue: 100,
                onUpdate: (v) => { 
                    $card.style.setProperty('--pointer-°', `${(angleEnd - angleStart) * (v / 100) + angleStart}deg`); 
                }
            });

            animateNumber({
                ease: easeInCubic, 
                duration: 1500, 
                delay: 2500, 
                startValue: 100, 
                endValue: 0,
                onUpdate: (v) => $card.style.setProperty('--pointer-d', v),
                onEnd: () => $card.classList.remove('animating')
            });
        }

        function easeOutCubic(x) { 
            return 1 - Math.pow(1 - x, 3); 
        }

        function easeInCubic(x) { 
            return x * x * x; 
        } 

        function animateNumber(options) {
            const { 
                startValue = 0, 
                endValue = 100, 
                duration = 1000, 
                delay = 0, 
                onUpdate = () => {}, 
                ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, 
                onStart = () => {}, 
                onEnd = () => {} 
            } = options;
            
            const startTime = performance.now() + delay;

            function update() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                onUpdate(startValue + (endValue - startValue) * ease(t));
                
                if (t < 1) {
                    requestAnimationFrame(update); 
                } else {
                    onEnd();
                }
            }
            
            setTimeout(() => { 
                onStart(); 
                requestAnimationFrame(update); 
            }, delay);
        }

        // ==========================================
        // ИНИЦИАЛИЗАЦИЯ ЗУМА (PANZOOM)
        // ==========================================
        const imgElem = document.getElementById('price-img');
        const imgContainer = document.getElementById('img-container');
        
        const panzoomInstance = Panzoom(imgElem, {
            maxScale: 4,     // Приближение до 4x
            minScale: 1,     // Отдалить меньше исходного размера нельзя
            step: 0.2,       // Шаг зума
            contain: false   // Позволяем свободно таскать картинку
        });

        // Биндим зум на колесико мыши
        imgContainer.addEventListener('wheel', panzoomInstance.zoomWithWheel);

        // Слушаем событие изменения масштаба
        imgElem.addEventListener('panzoomzoom', (e) => {
            const hint = document.getElementById('zoom-hint');
            const resetBtn = document.getElementById('reset-zoom');
            
            // Если масштаб больше исходного
            if (e.detail.scale > 1.05) {
                hint.style.opacity = '0'; // Скрываем плашку подсказки
                resetBtn.style.display = 'block'; // Показываем кнопку Reset
            } else {
                hint.style.opacity = '1';
                resetBtn.style.display = 'none';
            }
        });

        // Функция принудительного сброса зума (вызывается по кнопке или при закрытии окна)
        window.resetImgZoom = function() {
            panzoomInstance.reset();
            document.getElementById('zoom-hint').style.opacity = '1';
            document.getElementById('reset-zoom').style.display = 'none';
        };

    </script>
</body>
