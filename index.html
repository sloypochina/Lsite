<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANSANE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

        body { 
            background: #000; 
            color: white; 
            overflow: hidden; 
            font-family: 'Space Grotesk', sans-serif; 
            margin: 0; 
            height: 100vh;
        }

        /* Видео-фон */
        .video-bg {
            position: fixed; inset: 0; z-index: -3;
            width: 100vw; height: 100vh;
            object-fit: cover;
            filter: blur(5px) brightness(0.4); 
        }

        /* Стилизованная виньетка */
        body::after {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(15, 30, 80, 0.4) 80%, rgba(0,0,0,0.9) 100%);
            box-shadow: inset 0 0 100px rgba(59, 130, 246, 0.2);
            pointer-events: none; 
            z-index: -1;
        }

        /* Тот самый эффект сканирующих линий */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Общие стили кнопок */
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            text-align: center;
        }
        
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* Кнопка PRICE: ширина -30% (225px) и меньше высота */
        .btn-price-main {
            width: 100%;
            max-width: 225px; /* Уменьшили ширину согласно твоей просьбе */
            padding: 12px 15px !important; /* Меньше высота */
            font-size: 1.1rem; /* Чуть меньше шрифт, чтобы всё влезло */
            border: 2px solid rgba(59, 130, 246, 0.4);
            margin-bottom: 15px;
        }

        /* Окно Прайса */
        .price-win {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a0a;
            border: 2px solid #3b82f6;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            z-index: 100;
            width: 90%;
            max-width: 550px;
            display: none;
        }
        .win-header {
            background: #3b82f6;
            color: white;
            padding: 10px 15px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
        }
        .price-img-container {
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* Заголовок с анимацией */
        .killer-header span {
            display: inline-block;
            animation: snake-jump 4s infinite;
            transition: 0.3s ease-out;
        }
        .killer-header span:hover {
            animation: none !important;
            transform: scale(1.6) translateY(-10px);
            text-shadow: 0 0 20px currentColor;
        }
        
        /* Цвета при наведении */
        .hover-color-1 { color: #3b82f6 !important; }
        .hover-color-2 { color: #f472b6 !important; }
        .hover-color-3 { color: #a855f7 !important; }
        .hover-color-4 { color: #ffffff !important; }
        .hover-color-5 { color: #fbbf24 !important; }

        @keyframes snake-jump {
            0%, 100% { transform: translateY(0); }
            5% { transform: translateY(-20px); }
            10% { transform: translateY(0); }
        }

        .trail-star { position: absolute; pointer-events: none; z-index: 9999; color: #ffffff; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-bg" id="bg-video">
        <source src="img/bg.mp4" type="video/mp4">
    </video>
    
    <header class="absolute top-10 left-10 md:left-20 z-10">
        <h1 class="killer-header text-5xl md:text-6xl uppercase tracking-tighter font-black whitespace-nowrap text-white">
            <span style="animation-delay: 0.1s;">&lt;</span><span style="animation-delay: 0.2s;">D</span><span style="animation-delay: 0.3s;">A</span><span style="animation-delay: 0.4s;">N</span><span style="animation-delay: 0.5s;">S</span><span style="animation-delay: 0.6s;">A</span><span style="animation-delay: 0.7s;">N</span><span style="animation-delay: 0.8s;">E</span><span style="animation-delay: 0.9s;">&gt;</span>
        </h1>
    </header>

    <div class="absolute top-1/2 left-0 w-full transform -translate-y-1/2 flex flex-col items-center gap-4 px-4 z-10">
        
        <button onclick="openPrice(); createTrail(event)" class="glass-btn btn-price-main">
            PRICE_LIST.PNG
        </button>

        <div class="flex flex-wrap justify-center gap-4">
            <a href="https://tiktok.com/" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">TIKTOK</a>
            <a href="https://instagram.com/" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">INSTAGRAM</a>
            <a href="https://boosty.to/" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">BOOSTY</a>
            <a href="https://t.me/ТВОЙ_ТГ" target="_blank" onclick="createTrail(event)" class="glass-btn text-sm">TG_ACC.EXE</a>
        </div>

    </div>

    <div id="price-window" class="price-win">
        <div class="win-header">
            <span>IMAGE_VIEWER.EXE - price.jpg</span>
            <button onclick="closePrice()" style="cursor: pointer;">[ CLOSE X ]</button>
        </div>
        <div class="price-img-container">
            <img src="img/price.jpg" alt="Price List" class="w-full h-auto block">
        </div>
    </div>

    <script>
        window.onload = () => { document.getElementById('bg-video').play(); };

        $( function() {
            $( "#price-window" ).draggable({ handle: ".win-header" });
        });

        function openPrice() { $('#price-window').fadeIn(200); }
        function closePrice() { $('#price-window').fadeOut(200); }
        
        $('.killer-header span').on('mouseenter', function() {
            const randomColorNum = Math.floor(Math.random() * 5) + 1;
            $(this).addClass('hover-color-' + randomColorNum);
        }).on('mouseleave', function() {
            $(this).removeClass('hover-color-1 hover-color-2 hover-color-3 hover-color-4 hover-color-5');
        });

        function createTrail(e) {
            const el = document.createElement('div');
            el.className = 'trail-star';
            el.innerHTML = '✦';
            el.style.left = e.pageX + 'px'; el.style.top = e.pageY + 'px';
            document.body.appendChild(el);
            $(el).animate({ opacity: 0, top: '-=50px', fontSize: '30px' }, 800, () => el.remove());
        }
    </script>
</body>
</html>
